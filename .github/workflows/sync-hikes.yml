name: sync-hikes
on:
  schedule:
    # GitHub may delay scheduled runs. Each run also retries stale responses.
    - cron: '45 3-21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-hikes
  cancel-in-progress: false
jobs:
  sync:
    # Manual runs from feature branches must never publish production data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Test sync validation
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/hike-refresh.test.cjs
      - name: Fetch latest generated hikes
        timeout-minutes: 10
        env:
          EXEC_URL: ${{ secrets.HIKES_EXEC_URL }}
        run: python3 scripts/sync_hikes.py fetch --output "$RUNNER_TEMP/hikes.candidate.json"
      - name: Commit validated data
        run: |
          # Re-check against current main after the potentially slow fetch.
          git pull --ff-only origin main
          python3 scripts/sync_hikes.py apply --candidate "$RUNNER_TEMP/hikes.candidate.json"
          git config user.name "hikes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hikes.json
          if ! git diff --staged --quiet; then
            git commit -m "sync hikes $(date -I)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not push validated data after three attempts."
                exit 1
              fi
              git fetch origin main
              # Never let Git text-merge two snapshots into a mixed feed.
              if ! git diff --quiet HEAD^ origin/main -- hikes.json; then
                echo "::error::hikes.json changed concurrently; rerun to validate against current main."
                exit 1
              fi
              git rebase origin/main
            done
          fi
      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bot commit alone is not a reliable Pages deployment trigger.
          # Also recover a prior publication failure when data is unchanged.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify published data
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          python3 scripts/sync_hikes.py verify --url "${site_url%/}/hikes.json"
      - name: Report outcome
        if: always()
        env:
          SYNC_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Hike sync: $SYNC_STATUS"
            echo "Success requires validated upstream data and matching public hikes.json."
            echo "A stale upstream failure preserves the committed snapshot; inspect the exporter if retries are exhausted."
          } >> "$GITHUB_STEP_SUMMARY"
