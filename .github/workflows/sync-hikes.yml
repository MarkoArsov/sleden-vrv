name: sync-hikes
on:
  schedule:
    # Run away from GitHub Actions' busiest top-of-hour queue. These spaced
    # attempts recover when the upstream scrape has not finished yet or its
    # endpoint briefly returns a 5xx response.
    - cron: '23 6,9,12,15 * * *' # UTC — 08:23, 11:23, 14:23, 17:23 Europe/Skopje in daylight-saving time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-hikes
  # A manual run or a delayed scheduled run must finish; cancelling it could
  # discard the only fresh snapshot it retrieved.
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest generated hikes
        env:
          EXEC_URL: ${{ secrets.HIKES_EXEC_URL }}
        run: |
          curl --silent --show-error --location --fail --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 420 --connect-timeout 15 --max-time 60 "${EXEC_URL}?refresh=1&_=$(date +%s%N)" -o hikes.new.json
          python3 -c "import json,sys; d=json.load(open('hikes.new.json')); sys.exit(0 if isinstance(d.get('hikes'), list) else 1)"
          if python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json

          candidate = json.load(open("hikes.new.json"))
          generated = candidate.get("generatedAt")
          today = candidate.get("today")
          try:
              current = datetime.fromisoformat(generated.replace("Z", "+00:00")).astimezone(ZoneInfo("Europe/Skopje"))
          except (AttributeError, ValueError):
              print("Refusing payload without a valid generatedAt timestamp.")
              raise SystemExit(1)

          if current.date().isoformat() != today:
              print("Refusing payload not generated on the server's current day; generatedAt=" + str(generated) + ", today=" + str(today))
              raise SystemExit(1)

          previous = None
          if Path("hikes.json").exists():
              old = json.load(open("hikes.json")).get("generatedAt")
              if old:
                  previous = datetime.fromisoformat(old.replace("Z", "+00:00"))
          if previous and current <= previous:
              print("hikes.json already contains this generated snapshot.")
              raise SystemExit(2)

          print("Accepting generated payload from " + str(generated))
          PY
          then
            mv hikes.new.json hikes.json
          else
            result=$?
            if [ "$result" -eq 2 ]; then
              exit 0
            fi
            exit "$result"
          fi

      - name: Commit if changed
        run: |
          git config user.name "hikes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hikes.json
          git diff --staged --quiet || git commit -m "sync hikes $(date -I)"
          git push
